#
# Playbook to setup a clean ROV image 
# 
# This assumes a fresh Ubuntu install.
# 
- name: Configure the RPi to be an ROV
  hosts: all 
  become: yes
  tasks:
    # This will fail if you try it on a desktop. Good.
    - name: Set kernel command line parameters to remove ttyS0
      ansible.builtin.copy:
        content: 'dwc_otg.lpm_enable=0 console=tty1 root=LABEL=writable rootfstype=ext4 rootwait fixrtc quiet splash'
        dest: /boot/firmware/cmdline.txt
    - name: disable camera auto detect
      become: true
      lineinfile:
        path: /boot/firmware/config.txt
        regexp: camera_auto_detect=
        line: "#camera_auto_detect="
        state: present

    - name: Set gpu_mem
      become: true
      lineinfile:
        path: /boot/firmware/config.txt
        regexp: gpu_mem=
        line: gpu_mem=256

    - name: Set i2c baud rate
      become: true
      lineinfile:
        path: /boot/firmware/config.txt
        regexp: dtparam=i2c_arm_baudrate=
        line: 'dtparam=i2c_arm_baudrate=400000'

    - name: Set start_x  
      become: true
      lineinfile:
        path: /boot/firmware/config.txt
        regexp: start_x=
        line: start_x=1

    # Access to i2c
    - name: Add ubuntu to the dialout group
      become: true
      user:
        name: ubuntu
        groups: dialout
        append: yes

    - name: Disable eee using /etc/rc.local
      ansible.builtin.copy:
        content: |
          #! /bin/bash 
          ethtool --set-eee eth0 eee off
        dest: /etc/rc.local
        owner: root
        group: root
        mode: '0755'

    - name: Make sudo passwordless for members of sudo
      lineinfile:
        path: /etc/sudoers
        regexp: "^%sudo"
        line: "%sudo   ALL=(ALL:ALL) NOPASSWD: ALL"

    - name: Improve performance of vscode 
      ansible.posix.sysctl:
        name: fs.inotify.max_user_watches
        value: '524288'
        state: present


- name: Install ROV tools
  hosts: all 
  become: yes
  roles:
    - ros
    - common
  tasks:
    - name: Install ROV 
      apt:
        name:
          - automake 
          - autoconf 
          - build-essential 
          - texinfo 
          - libtool 
          - libftdi-dev 
          - libusb-1.0-0-dev
          - gdb-multiarch
          - avahi-daemon
        state: present
    
- name: Add user accounts
  hosts: all 
  become: yes
  vars:
    users:
      - { name: 'mmatera', comment: 'Mike Matera', ghuser: 'mike-matera' }
      - { name: 'zaretsky', comment: 'Ben Zaretsky', ghuser: 'keplerrov' }
      - { name: 'lavandula', comment: 'Diana Ellefson', ghuser: 'OrionOth' }
      - { name: 'rowan', comment: 'Rowan Delander', ghuser: 'Rowan-D' }
      - { name: 'daniela', comment: 'Daniel Alivov', ghuser: 'danielalivov' }
  tasks:
    - name: Add user
      ansible.builtin.user:
        name: "{{ item.name }}"
        comment: "{{ item.comment }}"
        shell: /usr/bin/bash
        groups:  adm,dialout,cdrom,floppy,sudo,audio,dip,video,plugdev,netdev,lxd
        state: present
      loop: "{{ users }}"
    - name: Import keys from GitHub
      ansible.posix.authorized_key:
        user: "{{ item.name }}"
        key: "https://github.com/{{ item.ghuser }}.keys"
        state: present
      loop: "{{ users }}"
